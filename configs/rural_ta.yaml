# configs/rural_ta.yaml   — Senaryo C: Kırsal + TA Var
run:
  scenario: "C"
  name: "Kırsal + TA Var"
  seed: 42

morphology: "rural"     # ADR-17: ISD=2000m, RMa, ant_height=45m, radius=20km

area:
  origin_lat: 38.6748
  origin_lon: 39.2225
  radius_km: 20         # kırsal profil

simulation:
  agents: 1000
  duration_days: 30
  tick_minutes: 5

network:
  sites_min: 100
  sites_max: 150
  rx_sensitivity_dbm: -110

radio:
  shadowing_sigma_db: 7
  d_max_km: 10          # RMa geçerlilik sınırı

timing_advance:
  enabled: true
  technology: "LTE"

analysis:
  grid_resolution_m: 150            # ADR-26: kırsalda maliyet/parçalanma dengesi
  contour_levels: [0.50, 0.90, 0.95]
  neighbor_max_count: 8
  sample:
    calibration_events: 2000
    validation_events: 3000    # ADR-14/ADR-26: yeni çözünürlükte maliyet dengesi

calibration:
  split_ratio: 0.80
  lambda_min: 0.5
  lambda_max: 3.0
  target_coverage: 0.90
  tolerance: 0.005
  max_iterations: 12

integrity:
  max_velocity_kmh: 300
  injection_rate: 0.02
  rule_weights: {1: 0.2, 2: 0.2, 3: 0.2, 4: 0.2, 5: 0.2}
  detection:                        # ADR-27..31 (Sprint 6) — tespit tarafı
    velocity_margin_cap: 1.0e6      # ADR-31: Δt=0 → sonsuz hız; margin kapılır
    time_backstep_tolerance_s: 0    # ADR-29: katı karşılaştırma, tick-içi eşitlik ihlal değil
    activity_min_support: 2         # ADR-27: modal IMEI referansı için asgari destek
    min_findings_for_threshold: 30  # ADR-31: K7 ölçülebilirlik kuralı

privacy:
  k_anonymity: 5
  hmac_salt_env: "HMAC_SALT"

api:
  max_geometries_per_request: 500
