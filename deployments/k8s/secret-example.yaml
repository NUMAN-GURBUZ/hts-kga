# ÖRNEK dosyadır — gerçek parola/sır İÇERMEZ (repo public, bkz. README).
#
# `kubectl create secret generic hts-kga-secrets --from-env-file=.env -n hts-kga`
# ile .env'den gerçek Secret'ı kendiniz oluşturun; bu dosyayı doğrudan
# `kubectl apply` ETMEYİN.
apiVersion: v1
kind: Secret
metadata:
  name: hts-kga-secrets
  namespace: hts-kga
type: Opaque
stringData:
  POSTGRES_USER: CHANGE_ME
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: hts_kga
  HMAC_SALT: CHANGE_ME_64_HEX_CHARS_MINIMUM
  KAFKA_PW_ANALYSIS: CHANGE_ME
  KAFKA_PW_INTEGRITY: CHANGE_ME
  KAFKA_PW_SIMULATOR: CHANGE_ME
  KAFKA_PW_RECORDS: CHANGE_ME
  KAFKA_PW_GT: CHANGE_ME
  GATEWAY_DB_PASSWORD: CHANGE_ME
