# K9'un ADR-16'daki kararı: bu Deployment ölçekleme ÖLÇÜMÜ için değil,
# dağıtım belgesi içindir. Gerçek K9 ölçümü Docker Compose'da yapılır
# (deployments/compose/docker-compose.yml, `analysis-engine` servisi,
# ADR-34/4) — burada `replicas` yalnızca örnektir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-engine
  namespace: hts-kga
  labels:
    app: analysis-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-engine
  template:
    metadata:
      labels:
        app: analysis-engine
    spec:
      containers:
        - name: analysis-engine
          image: hts-kga/analysis-engine:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hts-kga-config
            - secretRef:
                name: hts-kga-secrets
          env:
            - name: KAFKA_SASL_USER
              value: "svc_analysis"
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hts-kga-secrets
                  key: KAFKA_PW_ANALYSIS
            # HTS_RUN_ID koşuya özgüdür — üretimde bir Job/CronJob veya
            # dağıtım aracı tarafından geçersiz kılınmalıdır.
            - name: HTS_RUN_ID
              value: "00000000-0000-0000-0000-000000000000"
          ports:
            - name: health
              containerPort: 8082
            - name: metrics
              containerPort: 2113
          volumeMounts:
            - name: scenarios
              mountPath: /configs
              readOnly: true
          livenessProbe:
            httpGet: { path: /health, port: health }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: health }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
      volumes:
        - name: scenarios
          configMap:
            name: hts-kga-scenarios
