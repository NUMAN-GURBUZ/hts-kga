# ==============================================================================
# HTS-KGA — Docker Compose
# T-E01-02 (Compose + healthcheck) · T-E01-03 (PostgreSQL/PostGIS/TimescaleDB)
# T-E01-04 (Kafka KRaft + Redis 7)
# ==============================================================================

name: hts-kga

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL 15 + PostGIS 3.4 + TimescaleDB 2.x — T-E01-03
  # timescaledb/timescaledb-ha içerir PostGIS'i de bundled olarak
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb-ha:pg15-latest
    container_name: hts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-hts_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hts_dev_password_2024}
      POSTGRES_DB:       ${POSTGRES_DB:-hts_kga}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────────────────
  # Apache Kafka — KRaft modu (Zookeeper yok), 4 partition kapasiteli
  # T-E01-04
  # ─────────────────────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: hts-kafka
    restart: unless-stopped
    environment:
      # KRaft zorunlu değişkenleri
      KAFKA_NODE_ID:                          1
      KAFKA_PROCESS_ROLES:                    broker,controller
      # ADR-32: SASL_PLAINTEXT + SCRAM-SHA-256 + StandardAuthorizer.
      # Kör testin 1. katmanı buna dayanır: PLAINTEXT'te her bağlantı
      # ANONYMOUS principal'ıdır ve `User:svc_analysis` diye bir özne yoktur,
      # dolayısıyla ona uygulanacak bir yasak da yoktur.
      # Üç dinleyici (ADR-32/1):
      #   SASL://:9092     yayınlanır — tüm servis istemcileri, SCRAM kimlikli
      #   INTERNAL://:9094 yayınlanmaz — broker'lar arası + kurulum CLI'ı
      #   CONTROLLER://:9093 yayınlanmaz — KRaft quorum
      KAFKA_LISTENERS:                        SASL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS:             SASL://localhost:9092,INTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   SASL:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:        CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:         1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS:          SCRAM-SHA-256
      # Yetkilendirme (ADR-32/2). Kafka'nın varsayılanı
      # `allow.everyone.if.no.acl.found=false`: ACL yoksa REDDET.
      # svc_analysis ve svc_integrity için hts.groundtruth üzerinde hiçbir
      # kayıt yoktur — yasak, DENY kuralıyla değil yetki vermeyerek kurulur.
      KAFKA_AUTHORIZER_CLASS_NAME:            org.apache.kafka.metadata.authorizer.StandardAuthorizer
      # Süper kullanıcı yalnızca yayınlanmayan 9094'ten ulaşılabilir (ADR-32/3).
      KAFKA_SUPER_USERS:                      User:ANONYMOUS
      # SASL sunucu tarafı bildirimi. Dosyada parola YOKTUR: SCRAM'da sunucu,
      # istemci parolalarını doğrulamak için sırra ihtiyaç duymaz — tuzlanmış
      # karmalar broker meta verisindedir.
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/jaas/broker_jaas.conf
      # Performans / güvenilirlik
      KAFKA_LOG_RETENTION_HOURS:              168       # 7 gün — simülasyon süresi + marj
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "false"   # topic'ler make seed-kafka ile oluşturulur
      KAFKA_NUM_PARTITIONS:                   4
      KAFKA_DEFAULT_REPLICATION_FACTOR:       1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:    1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./kafka:/etc/kafka/jaas:ro
    healthcheck:
      # Sağlık denetimi iç porttan yapılır: SASL kimlikleri broker ayağa
      # kalktıktan sonra yazılır (make seed-kafka), dolayısıyla 9092 ilk
      # açılışta henüz kimlik doğrulayamaz.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis 7 — hücre envanteri önbelleği (T-E01-04, T-E01-09)
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hts-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus + Grafana — OTel metrik toplama (T-E09; Sprint 0'da stub)
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: hts-prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.1
    container_name: hts-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  kafka_data:
  grafana_data:
