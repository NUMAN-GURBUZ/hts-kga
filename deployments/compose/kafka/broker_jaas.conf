// ADR-32 — Broker'ın SASL SUNUCU tarafı bildirimi.
//
// # Bu dosyada parola yok ve olmayacak
//
// SCRAM'da sunucu, istemci parolalarını **doğrulamak** için hiçbir sırra ihtiyaç
// duymaz: tuzlanmış karmalar broker meta verisinde durur ve
// `kafka-configs.sh --entity-type users` ile yönetilir. Sunucunun ihtiyacı
// yalnızca "bu dinleyicide SCRAM mekanizmasını kullan" bildirimidir.
//
// Broker'lar arası dinleyici PLAINTEXT olduğu için (ADR-32/1, tek düğüm)
// broker'ın kendisi bir SCRAM İSTEMCİSİ olarak bağlanmaz — dolayısıyla
// `username`/`password` alanları gereksizdir. Bu, JAAS dosyasını repo'ya
// parola sokmadan commit edilebilir kılar.
//
// Üretim dağıtımında birden çok broker olursa broker'lar arası dinleyici de
// SASL yapılır ve o zaman bu dosya bir sır yöneticisinden mount edilir.

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
